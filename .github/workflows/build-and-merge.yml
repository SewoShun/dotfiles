name: build and merge

on:
  pull_request:
    branches:
      - main

jobs:
  nix-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: sewoshun
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: natsukium/nix-diff-action@main
        with:
          attributes: |
            - displayName: thinkpad-e14-gen7
              attribute: nixosConfigurations.thinkpad-e14-gen7.config.system.build.toplevel
            - displayName: desktop
              attribute: nixosConfigurations.desktop.config.system.build.toplevel

  build-thinkpad-e14-gen7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: sewoshun
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#nixosConfigurations.thinkpad-e14-gen7.config.system.build.toplevel

  build-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: sewoshun
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#nixosConfigurations.desktop.config.system.build.toplevel

  auto-merge:
    runs-on: ubuntu-latest
    needs: [nix-diff, build-thinkpad-e14-gen7, build-desktop]
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{github.event.pull_request.html_url}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh pr merge --merge --auto "$PR_URL"
